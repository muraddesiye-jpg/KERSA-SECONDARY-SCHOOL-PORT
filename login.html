<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Login | Kersa Secondary School</title><link rel="stylesheet" href="/css/style.css"></head><body data-kersa-experience="aurora-2026" class="auth-page"><div class="auth-orbit one"></div><div class="auth-orbit two"></div><div class="auth-card premium-auth"><a class="brand center" href="/"><span class="logo">K</span><span>KERSA<br><small>SECONDARY SCHOOL</small></span></a><span class="eyebrow">SECURE DIGITAL CAMPUS</span><h1>Welcome back.</h1><p class="muted">Student • Teacher • Parent • Administrator</p><form id="loginForm"><label>Email, username or phone<input name="identifier" autocomplete="username" required></label><label>Password<div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="eye" data-toggle="password" aria-label="Show password">◉</button></div><small class="field-hint">Capitalization matters: passwords are case-sensitive.</small></label><button class="btn btn-primary full">Login securely <span>→</span></button></form><div id="msg" class="form-msg"></div><div class="auth-links"><a href="/register.html">New student? Apply online</a><a href="/register.html#statusForm">Check registration status</a></div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.toggle);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'◉':'◌';b.setAttribute('aria-label',i.type==='password'?'Show password':'Hide password')});document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Signing in…';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),d=await r.json();if(!r.ok){msg.innerHTML=`<div class="error-box">${esc(d.error)}</div>`;return}location.href='/dashboard.html';};</script></body></html>
